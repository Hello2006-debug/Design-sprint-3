<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Museum of Wonders</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <style>
    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f7ebdd;
      color: #5a4636;
      font-family: Georgia, serif;
      text-align: center;
    }

    #start button {
      margin-top: 24px;
      padding: 14px 36px;
      font-size: 18px;
      border-radius: 999px;
      border: 1px solid #5a4636;
      background: transparent;
      color: #5a4636;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div id="start">
    <h1>Museum of Seven Wonders Of the World</h1>
    <p>Put on headphones, relax, and get comfortable.<br>Look at a frame to hear its story,and let the narration guide
      you.<br>Look away to pause.</p>
    <button id="begin">Begin</button>
  </div>
  <a-scene>

    <!-- Photos are loaded once here, then used by frames -->
    <a-assets>
      <!-- Taj Mahal -->
      <img id="taj_mahal_1" src="images/taj_mahal_1.jpg" alt="Taj Mahal, wide view">
      <img id="taj_mahal_2" src="images/taj_mahal_2.jpg" alt="Taj Mahal, carved details">
      <img id="taj_mahal_3" src="images/taj_mahal_3.jpg" alt="Taj Mahal through a red sandstone arch">
      <img id="taj_mahal_4" src="images/taj_mahal_4.jpg" alt="Taj Mahal garden">
      <!-- Christ the Redeemer-->
      <img id="christ_1" src="images/christ_1.jpg" alt="Christ the Redeemer, wide view">
      <img id="christ_2" src="images/christ_2.jpg" alt="Christ the Redeemer, close-up of the face">
      <img id="christ_3" src="images/christ_3.jpg" alt="Christ the Redeemer, panoramic view">
      <img id="christ_4" src="images/christ_4.jpg" alt="Christ the Redeemer, sunset">
      <!-- Great Wall -->
      <img id="greatwall_1" src="images/great_wall_1.jpeg" alt="Image of the Great Wall of China with mountains">
      <img id="greatwall_2" src="images/great_wall_2.jpeg" alt="Image of the Great Wall of China with people">
      <img id="greatwall_3" src="images/great_wall_3.jpeg" alt="Image of the Great Wall of China with fall leaves">
      <img id="greatwall_4" src="images/great_wall_4.jpeg" alt="Image of the Great Wall of China overview">
      <!-- Colosseum -->
      <img id="colosseum_1" src="images/colosseum_1.jpg" alt="Image of the Colosseum with stormy clouds">
      <img id="colosseum_2" src="images/colosseum_2.jpg" alt="Image of the Colosseum lit up">
      <img id="colosseum_3" src="images/colosseum_3.jpg" alt="Image of the Colosseum at night">
      <img id="colosseum_4" src="images/colosseum_4.jpg" alt="Image of the Colosseum showing brick path">
      <!-- Petra -->
      <img id="petra_1" src="images/petra_1.jpg" alt="Image of Petra close-up">
      <img id="petra_2" src="images/petra_2.jpg" alt="Image of Petra from canyon">
      <img id="petra_3" src="images/petra_3.jpg" alt="Image of Petra lit with candles">
      <img id="petra_4" src="images/petra_4.jpg" alt="Image of Petra with a camel in front">
      <!-- Machu Picchu -->
      <img id="machu_1" src="images/machu_1.jpg" alt="Image of Machu Piccu with neon green grass">
      <img id="machu_2" src="images/machu_2.jpg" alt="Image of Machu Piccu with llamas">
      <img id="machu_3" src="images/machu_3.jpg" alt="Image of Machu Piccu with clouds">
      <img id="machu_4" src="images/machu_4.jpg" alt="Image of Machu Piccu with sunlight streaming in">
      <!-- Chichen Itza -->
      <img id="chichen_1" src="images/chichen_1.jpg" alt="Image of Chichen Itza with people in front">
      <img id="chichen_2" src="images/chichen_2.jpg" alt="Image of Chichen Itza at night">
      <img id="chichen_3" src="images/chichen_3.jpg" alt="Image of Chichen Itza from far away with leaves in frame">
      <img id="chichen_4" src="images/chichen_4.jpg" alt="Image of Chichen Itza from close up">
    </a-assets>

    <!-- THE MUSEUM: everything inside this tag moves together as one thing -->
    <a-entity id="museum" position="0 0 0">

      <!-- Floor and ceiling (12 wide, 8 deep) -->
      <a-plane rotation="-90 0 0" width="12" height="8" color="#d9bd9a"></a-plane>
      <a-plane position="0 4 0" rotation="90 0 0" width="12" height="8" color="ffffff"></a-plane>

      <!-- Four walls -->
      <a-plane position="0 2 -4" width="12" height="4" color="#f7ebdd"></a-plane>
      <a-plane position="0 2 4" rotation="0 180 0" width="12" height="4" color="#f7ebdd"></a-plane>
      <a-plane position="-6 2 0" rotation="0 90 0" width="8" height="4" color="#f7ebdd"></a-plane>
      <a-plane position="6 2 0" rotation="0 -90 0" width="8" height="4" color="#f7ebdd"></a-plane>

      <!-- Ceiling trim (crown molding) on all four walls -->
      <!-- Cream boards -->
      <a-box position="0 3.9 -3.97" width="12" height="0.2" depth="0.06" color="#8b6a4f"></a-box>
      <a-box position="0 3.9 3.97" width="12" height="0.2" depth="0.06" color="#8b6a4f"></a-box>
      <a-box position="-5.97 3.9 0" width="0.06" height="0.2" depth="8" color="#8b6a4f"></a-box>
      <a-box position="5.97 3.9 0" width="0.06" height="0.2" depth="8" color="#8b6a4f"></a-box>

      <!-- Thin gold line along the bottom edge -->
      <a-box position="0 3.79 -3.96" width="12" height="0.02" depth="0.08" color="#d9b382"></a-box>
      <a-box position="0 3.79 3.96" width="12" height="0.02" depth="0.08" color="#d9b382"></a-box>
      <a-box position="-5.96 3.79 0" width="0.08" height="0.02" depth="8" color="#d9b382"></a-box>
      <a-box position="5.96 3.79 0" width="0.08" height="0.02" depth="8" color="#d9b382"></a-box>

      <!-- Doorway (left wall, near the back corner) -->
      <!-- wood border -->
      <a-plane position="-5.99 1.175 2.7" rotation="0 90 0" width="1.4" height="2.35"
        material="color: #8b6a4f"></a-plane>
      <!-- cap across the top -->
      <a-plane position="-5.98 2.39 2.7" rotation="0 90 0" width="1.56" height="0.1"
        material="color: #8b6a4f"></a-plane>
      <!-- thin gold line inside the border -->
      <a-plane position="-5.98 1.12 2.7" rotation="0 90 0" width="1.18" height="2.24"
        material="color: #d9b382"></a-plane>
      <!-- dark opening -->
      <a-plane position="-5.97 1.1 2.7" rotation="0 90 0" width="1.1" height="2.2"
        material="color: #2e2620; shader: flat"></a-plane>

      <!-- Spotlights over the frames -->
      <a-light type="spot" target="#taj_frame" position="-3 3.6 -2.8" color="#fff1dc" intensity="0.8" angle="35"
        penumbra="0.6" distance="5" decay="1"></a-light>
      <a-light type="spot" target="#christ_frame" position="3 3.6 -2.8" color="#fff1dc" intensity="0.8" angle="35"
        penumbra="0.6" distance="5" decay="1"></a-light>
      <a-light type="spot" target="#greatwall_frame" position="-4.8 3.6 0" color="#fff1dc" intensity="0.8" angle="35"
        penumbra="0.6" distance="5" decay="1"></a-light>
      <a-light type="spot" target="#colosseum_frame" position="4.8 3.6 0" color="#fff1dc" intensity="0.8" angle="35"
        penumbra="0.6" distance="5" decay="1"></a-light>
      <a-light type="spot" target="#petra_frame" position="0 4.5 2.8" color="#fff1dc" intensity="0.8" angle="35"
        penumbra="0.6" distance="5" decay="1"></a-light>
      <a-light type="spot" target="#machu_frame" position="3 3.6 2.8" color="#fff1dc" intensity="0.8" angle="35"
        penumbra="0.6" distance="5" decay="1"></a-light>
      <a-light type="spot" target="#chichen_frame" position="-3 3.6 2.8" color="#fff1dc" intensity="0.8" angle="35"
        penumbra="0.6" distance="5" decay="1"></a-light>

      <!-- Taj Mahal frame (front wall, slot 2) -->
      <a-box position="-2.5 1.8 -3.95" width="2.6" height="2" depth="0.05" color="#d9b382"></a-box>
      <a-plane position="-2.5 1.8 -3.92" width="2.4" height="1.8" color="#fff7ec"></a-plane>
      <a-image id="taj_frame" class="clickable" src="#taj_mahal_1" position="-2.5 1.8 -3.9" width="2.2"
        height="1.6"></a-image>
      <!-- Plaque: Taj Mahal -->
      <a-box position="-2.5 0.42 -3.95" width="2.8" height="0.66" depth="0.03" color="#fffaf3"></a-box>
      <a-box position="-2.5 0.72 -3.93" width="2.8" height="0.02" depth="0.03" color="#d9b382"></a-box>
      <a-text value="Taj Mahal" position="-2.5 0.55 -3.92" align="center" width="2.6" wrap-count="20"
        color="#5a4636"></a-text>
      <a-text value="Agra, India  -  Practice: balance" position="-2.5 0.3 -3.92" align="center" width="2.6"
        wrap-count="34" color="#8a5a3c"></a-text>

      <!-- Great Wall frame (left wall) -->
      <a-box position="-5.95 1.8 0" rotation="0 90 0" width="2.6" height="2" depth="0.05" color="#d9b382"></a-box>
      <a-plane position="-5.92 1.8 0" rotation="0 90 0" width="2.4" height="1.8" color="#fff7ec"></a-plane>
      <a-image id="greatwall_frame" class="clickable" src="#greatwall_1" position="-5.9 1.8 0" rotation="0 90 0"
        width="2.2" height="1.6"></a-image>

      <!-- Plaque: Great Wall -->
      <a-box position="-5.95 0.42 0" rotation="0 90 0" width="2.8" height="0.66" depth="0.03" color="#fffaf3"></a-box>
      <a-box position="-5.93 0.72 0" rotation="0 90 0" width="2.8" height="0.02" depth="0.03" color="#d9b382"></a-box>
      <a-text value="Great Wall of China" position="-5.92 0.55 0" rotation="0 90 0" align="center" width="2.6"
        wrap-count="20" color="#5a4636"></a-text>
      <a-text value="China  -  Practice: endurance" position="-5.92 0.3 0" rotation="0 90 0" align="center" width="2.6"
        wrap-count="34" color="#8a5a3c"></a-text>

      <!-- Christ The Redeemer frame (front wall, slot 3) -->
      <a-box position="2.5 1.8 -3.95" width="2.6" height="2" depth="0.05" color="#d9b382"></a-box>
      <a-plane position="2.5 1.8 -3.92" width="2.4" height="1.8" color="#fff7ec"></a-plane>
      <a-image id="christ_frame" class="clickable" src="#christ_1" position="2.5 1.8 -3.9" width="2.2"
        height="1.6"></a-image>


      <!-- Plaque: Christ the Redeemer -->
      <a-box position="2.5 0.42 -3.95" width="2.8" height="0.66" depth="0.03" color="#fffaf3"></a-box>
      <a-box position="2.5 0.72 -3.93" width="2.8" height="0.02" depth="0.03" color="#d9b382"></a-box>
      <a-text value="Christ the Redeemer" position="2.5 0.55 -3.92" align="center" width="2.6" wrap-count="20"
        color="#5a4636"></a-text>
      <a-text value="Rio de Janeiro  -  Practice: openness" position="2.5l 0.3 -3.92" align="center" width="2.6"
        wrap-count="34" color="#8a5a3c"></a-text>

      <!-- Colosseum frame (right wall) -->
      <a-box position="5.95 1.8 0" rotation="0 -90 0" width="2.6" height="2" depth="0.05" color="#d9b382"></a-box>
      <a-plane position="5.92 1.8 0" rotation="0 -90 0" width="2.4" height="1.8" color="#fff7ec"></a-plane>
      <a-image id="colosseum_frame" class="clickable" src="#colosseum_1" position="5.9 1.8 0" rotation="0 -90 0"
        width="2.2" height="1.6"></a-image>

      <!-- Plaque: Colosseum -->
      <a-box position="5.95 0.42 0" rotation="0 -90 0" width="2.8" height="0.66" depth="0.03" color="#fffaf3"></a-box>
      <a-box position="5.93 0.72 0" rotation="0 -90 0" width="2.8" height="0.02" depth="0.03" color="#d9b382"></a-box>
      <a-text value="Colosseum" position="5.92 0.55 0" rotation="0 -90 0" align="center" width="2.6" wrap-count="20"
        color="#5a4636"></a-text>
      <a-text value="Rome, Italy  -  Practice: impermanence" position="5.92 0.3 0" rotation="0 -90 0" align="center"
        width="2.6" wrap-count="34" color="#8a5a3c"></a-text>

      <!-- Petra frame -->
      <a-box position="0 2.05 3.95" rotation="0 180 0" width="1.8" height="2.5" depth="0.05" color="#d9b382"></a-box>
      <a-plane position="0 2.05 3.92" rotation="0 180 0" width="1.6" height="2.3" color="#fff7ec"></a-plane>
      <a-image id="petra_frame" class="clickable" src="#petra_1" position="0 2.05 3.9" rotation="0 180 0" width="1.4"
        height="2.1"></a-image>

      <!-- Plaque: Petra -->
      <a-box position="0 0.42 3.95" rotation="0 180 0" width="2.2" height="0.66" depth="0.03" color="#fffaf3"></a-box>
      <a-box position="0 0.72 3.93" rotation="0 180 0" width="2.2" height="0.02" depth="0.03" color="#d9b382"></a-box>
      <a-text value="Petra" position="0 0.55 3.92" rotation="0 180 0" align="center" width="2" wrap-count="20"
        color="#5a4636"></a-text>
      <a-text value="Petra, Jordan  -  Practice: awe" position="0 0.3 3.92" rotation="0 180 0" align="center" width="2"
        wrap-count="34" color="#8a5a3c"></a-text>

      <!-- Machu Picchu frame -->
      <a-box position="3 1.8 3.95" rotation="0 180 0" width="2.6" height="2" depth="0.05" color="#d9b382"></a-box>
      <a-plane position="3 1.8 3.92" rotation="0 180 0" width="2.4" height="1.8" color="#fff7ec"></a-plane>
      <a-image id="machu_frame" class="clickable" src="#machu_1" position="3 1.8 3.9" rotation="0 180 0" width="2.2"
        height="1.6"></a-image>

      <!-- Plaque: Machu Piccu -->
      <a-box position="3 0.42 3.95" rotation="0 180 0" width="2.8" height="0.66" depth="0.03" color="#fffaf3"></a-box>
      <a-box position="3 0.72 3.93" rotation="0 180 0" width="2.8" height="0.02" depth="0.03" color="#d9b382"></a-box>
      <a-text value="Machu Picchu" position="3 0.55 3.92" rotation="0 180 0" align="center" width="2.6" wrap-count="20"
        color="#5a4636"></a-text>
      <a-text value="Cusco Region, Peru  -  Practice: grounding" position="3 0.3 3.92" rotation="0 180 0" align="center"
        width="2.6" wrap-count="34" color="#8a5a3c"></a-text>

      <!-- Chichen Itza frame -->
      <a-box position="-3 1.8 3.95" rotation="0 180 0" width="2.6" height="2" depth="0.05" color="#d9b382"></a-box>
      <a-plane position="-3 1.8 3.92" rotation="0 180 0" width="2.4" height="1.8" color="#fff7ec"></a-plane>
      <a-image id="chichen_frame" class="clickable" src="#chichen_1" position="-3 1.8 3.9" rotation="0 180 0"
        width="2.2" height="1.6"></a-image>

      <!-- Plaque: Chichen Itza -->
      <a-box position="-3 0.42 3.95" rotation="0 180 0" width="2.8" height="0.66" depth="0.03" color="#fffaf3"></a-box>
      <a-box position="-3 0.72 3.93" rotation="0 180 0" width="2.8" height="0.02" depth="0.03" color="#d9b382"></a-box>
      <a-text value="Chichen Itza" position="-3 0.55 3.92" rotation="0 180 0" align="center" width="2.6" wrap-count="20"
        color="#5a4636"></a-text>
      <a-text value="Yucatan, Mexico  -  Practice: reflection on time" position="-3 0.3 3.92" rotation="0 180 0"
        align="center" width="2.6" wrap-count="34" color="#8a5a3c"></a-text>

    </a-entity>

    <!-- Light and camera stay OUTSIDE the museum, so moving the museum doesn't move you -->
    <a-light type="ambient" color="#ffe3c2" intensity="0.75"></a-light>

    <a-camera position="0 1.6 1">
      <a-cursor id="cursor" color="#8a5a3c" fuse="true" fuse-timeout="2000"
        raycaster="objects: .clickable; enabled: false">

        <!-- Loader: fills up around the cursor while you look at a frame -->
        <a-entity id="loader" visible="false">
          <!-- faint track behind it -->
          <a-entity geometry="primitive: ring; radiusInner: 0.035; radiusOuter: 0.045"
            material="color: #8a5a3c; shader: flat; transparent: true; opacity: 0.25"></a-entity>
          <!-- the part that fills -->
          <a-entity id="loader_fill" position="0 0 0.001"
            geometry="primitive: ring; radiusInner: 0.035; radiusOuter: 0.045; thetaStart: 90; thetaLength: -0.1"
            material="color: #8a5a3c; shader: flat; side: double"
            animation__fill="property: geometry.thetaLength; from: -0.1; to: -360; dur: 2000; easing: linear; startEvents: loader-start; pauseEvents: loader-stop; autoplay: false"></a-entity>
        </a-entity>

      </a-cursor>
    </a-camera>

  </a-scene>

  <script src="index.js"></script>
  <script src="taj_mahal.js"></script>
  <script src="Christ_redeemer.js"></script>
  <script src="colosseum.js"></script>
  <script src="petra.js"></script>
  <script src="great_wall.js"></script>
  <script src="machu_piccu.js"></script>
  <script src="chichen.js"></script>
  <script src="loader.js"></script>
  <div id="dbg"
    style="position:fixed;bottom:0;left:0;z-index:99;background:#fff;color:#000;font:12px monospace;padding:4px"></div>
  <script>
    setInterval(function () {
      var c = document.querySelector('canvas');
      document.getElementById('dbg').textContent =
        'win ' + innerWidth + 'x' + innerHeight +
        (c ? ' | canvas ' + c.clientWidth + 'x' + c.clientHeight +
          ' buf ' + c.width + 'x' + c.height : ' | no canvas');
    }, 500);
  </script>

</body>

</html>
