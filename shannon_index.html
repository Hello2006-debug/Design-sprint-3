<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
        <a-assets>
            <img id="greatwall" src="images/great_wall.jpeg" alt="Image of the Great Wall of China">
        </a-assets>
    <!-- Floor -->
      <a-plane rotation="-90 0 0" width="10" height="20" color="#C8B89A"></a-plane>

      <!-- Walls -->
       <a-box position = "0 2 -10" width="10" height="4" depth="0.2" color="#F2EFE9"></a-box>
       <a-box position = "0 2 10" width="10" height="4" depth="0.2" color="#F2EFE9"></a-box>
       <a-box position = "-5 2 0" width="0.2" height="4" depth="20" color="#F2EFE9"></a-box>
       <a-box position = "5 2 0" width="0.2" height="4" depth="20" color="#F2EFE9"></a-box>

       <!-- Ceiling -->
        <a-plane position="0 4 0" rotation="90 0 0" width="10" height="20" color="#FFFFFF"></a-plane>

        <!-- Great Wall of China Frame (left wall)-->
         <a-box position="-4.85 2 -6" rotation="0 90 0" width="2.4" height="1.8" depth="0.05" color="#5C4033"></a-box>
         <a-plane position="-4.85 2 -6" rotation="0 90 0" width="2" height="1.4" color="#888"></a-plane>

        <a-image src="#greatwall" position="-4.8 2 -6" rotation="0 90 0" width="2" height="1.4"></a-image>
    </a-scene>
  </body>
</html>
