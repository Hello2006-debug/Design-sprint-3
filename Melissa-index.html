<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wonder Museum</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>

    <!-- The floor: a flat plane turned to lie on the ground -->
    <a-plane rotation="-90 0 0" width="14" height="14" color="#f6dcc8"></a-plane>

    <!-- The background color all around you -->
    <a-sky color="#fdf1e3"></a-sky>

    <!-- Soft warm light so everything is visible -->
    <a-light type="ambient" color="#fff0dd" intensity="0.9"></a-light>

    <!-- You: a camera at eye height, with a small dot to aim with -->
    <a-camera position="0 1.6 0">
      <a-cursor color="#b8896b"></a-cursor>
    </a-camera>

  </a-scene>
</body>
</html>
